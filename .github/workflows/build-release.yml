name: Build Release Artifacts

# Builds the app and attaches the bundles, their .sig files and a merged
# latest.json to an existing GitHub release.
#
# The release is always created first, by release-please. A release created with
# the GITHUB_TOKEN does not fire the `release` event, so this workflow cannot
# listen for it — release-please.yml calls it directly via `workflow_call`.
# The `workflow_dispatch` trigger exists to re-run a failed build or to fill in a
# release that was published before this workflow existed.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to build and upload assets to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release, e.g. v0.4.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Windows runners default to PowerShell; every run step here is bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # One platform at a time: tauri-action merges latest.json by downloading
      # the release's copy, adding its own platform and uploading it again, so
      # two jobs finishing together can drop a platform from the file.
      max-parallel: 1
      matrix:
        include:
          - name: macOS (aarch64)
            runner: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # 22.04 rather than latest: an AppImage runs only on systems whose
          # glibc is at least as new as the one it was built against.
          - name: Linux (x86_64)
            runner: ubuntu-22.04
            rust-targets: ""
            args: ""
          - name: Windows (x86_64)
            runner: windows-latest
            rust-targets: ""
            args: ""

    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # tauri-action uploads to a release id. Passing the id rather than the tag
      # matters: with `tagName` the action rewrites the release title and body,
      # which would wipe the changelog release-please wrote.
      - name: Resolve release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"
          {
            echo 'notes<<MAISH_RELEASE_NOTES_EOF'
            gh release view "$TAG" --json body --jq .body
            echo 'MAISH_RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Ubuntu 22.04's libwayland-client next to the host's Mesa libEGL makes
      # the WebKit web process abort at start on current distributions ("Could
      # not create surfaceless EGL display: EGL_BAD_ALLOC"). Tauri reuses
      # linuxdeploy tools already in ~/.cache/tauri, so the GTK plugin it runs
      # is replaced by a wrapper that removes libwayland-* after the upstream
      # plugin (same URL tauri downloads it from). See the wrapper for details.
      - name: Keep libwayland out of the AppImage
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/tauri/upstream
          curl -fsSL -o ~/.cache/tauri/upstream/linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x ~/.cache/tauri/upstream/linuxdeploy-plugin-gtk.sh
          install -m 755 .github/scripts/linuxdeploy-plugin-gtk.sh ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both are mandatory. `tauri build` bundles first and signs afterwards,
          # so a missing key fails the job after the bundles already exist. The
          # password is not optional either: on CI the CLI substitutes an empty
          # string for a missing password instead of treating the key as
          # unencrypted, which a password-less key then rejects. The key must be
          # the counterpart of plugins.updater.pubkey in src-tauri/tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ steps.release.outputs.id }}
          releaseBody: ${{ steps.release.outputs.notes }}
          args: ${{ matrix.args }}
          # The per-user NSIS installer updates without an admin prompt.
          updaterJsonPreferNsis: true
          retryAttempts: 2

      # Guards the wrapper above, e.g. against a tauri release that stops
      # reusing its cache. Runs after the upload, because tauri-action builds
      # and uploads in one step; a failure marks an AppImage already attached.
      - name: Verify the AppImage libraries
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            node .github/scripts/verify-appimage-libs.mjs "$f"
          done

      # A bundle whose signature covers only the executable is reported as
      # "damaged" by Gatekeeper and cannot be opened at all. signingIdentity "-"
      # in tauri.conf.json seals the whole bundle ad hoc; this keeps it that way.
      - name: Verify the bundle signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Maish.app

  # Every platform must end up in latest.json, signed with the key the app
  # trusts, or clients on the missing platform never see the update.
  verify-updater-json:
    name: Verify latest.json
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Check platforms and signing key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json --dir /tmp/updater
          node .github/scripts/verify-updater-json.mjs /tmp/updater/latest.json src-tauri/tauri.conf.json \
            darwin-aarch64 linux-x86_64 windows-x86_64
