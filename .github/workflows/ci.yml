name: CI

# Gates every pull request and every push to main. Nothing else runs the test
# suites: tsc only ran incidentally inside beforeBuildCommand during a release.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend (tsc, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Vitest's default include also picks up
      # .github/scripts/verify-updater-json.test.mjs, so the checker the release
      # workflow relies on is tested here too.
      - name: Test
        run: npm run test

  rust:
    name: Rust (test, clippy, fmt)
    # Same image as the Linux release build, so both link against the same
    # webkit2gtk.
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Cheapest check first: a formatting slip fails in seconds.
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
